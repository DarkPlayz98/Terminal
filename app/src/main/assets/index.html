<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  body { 
    margin: 0; 
    background: #000; 
    color: #fff; 
    font-family: monospace; 
    overflow: hidden; 
  }
  #terminal { 
    padding: 15px; 
    height: 100vh; 
    box-sizing: border-box; 
    overflow-y: auto; 
  }
  .glass-panel {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 15px;
    transition: all 0.3s ease;
  }
  .input-line { 
    display: flex; 
    align-items: center; 
  }
  .prompt { 
    color: #00ffcc; 
    margin-right: 10px; 
    font-weight: bold;
  }
  input {
    background: transparent; 
    border: none; 
    color: #fff;
    font-family: monospace; 
    font-size: 16px; 
    flex-grow: 1; 
    outline: none;
  }
  /* Fire Download Animation */
  @keyframes fire-glow {
    0% { box-shadow: 0 0 5px #ff4500, 0 0 10px #ff4500; border-color: #ff4500; }
    50% { box-shadow: 0 0 20px #ff8c00, 0 0 30px #ff8c00; border-color: #ff8c00; }
    100% { box-shadow: 0 0 5px #ff4500, 0 0 10px #ff4500; border-color: #ff4500; }
  }
  .downloading {
    animation: fire-glow 1s infinite;
  }
</style>
</head>
<body>
<div id="terminal">
  <div class="glass-panel" id="output">Core Engine Initialized.<br>Ready for input.</div>
  <div class="input-line glass-panel" id="input-container">
    <span class="prompt">Itz_MeDark@local:~$</span>
    <input type="text" id="cmd" autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  </div>
</div>

<script>
  const input = document.getElementById('cmd');
  const output = document.getElementById('output');
  const inputContainer = document.getElementById('input-container');

  input.addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      const command = input.value.trim();
      if (!command) return;
      
      output.innerHTML += `<br><br><span class="prompt">Itz_MeDark@local:~$</span> ${command}`;
      input.value = '';

      if (command.startsWith('install')) {
         inputContainer.classList.add('downloading');
         output.innerHTML += `<br>[*] Igniting download streams...`;
         // Send command to Kotlin native bridge
         Android.installPackage(command.split(' ')[1]);
      } else {
         // Pass standard commands to the native shell
         Android.execute(command);
      }
      scrollToBottom();
    }
  });

  function stopDownloadAnimation(msg) {
     inputContainer.classList.remove('downloading');
     output.innerHTML += `<br>${msg}`;
     scrollToBottom();
  }

  function appendOutput(msg) {
     output.innerHTML += `<br>${msg}`;
     scrollToBottom();
  }

  function scrollToBottom() {
     document.getElementById('terminal').scrollTop = document.getElementById('terminal').scrollHeight;
  }
</script>
</body>
</html>
